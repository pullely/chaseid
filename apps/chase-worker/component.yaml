apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: chase-worker
  description: Cloudflare Worker for the Chaseid client register, the Companies House sync and the verification chase
spec:
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/chase-worker
  dependsOn:
    - component: membership-worker
    - component: policy-worker
    - component: notifications-worker
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://ws_G4TNSD0A/chaseid/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://ws_G4TNSD0A/chaseid/prod/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_KV_STAGE: "secret://ws_G4TNSD0A/chaseid/stage/WIRING_CLOUDFLARE_KV"
    WIRING_CLOUDFLARE_KV_PROD: "secret://ws_G4TNSD0A/chaseid/prod/WIRING_CLOUDFLARE_KV"
  # CH-A: there is no Companies House key on this account, and the product is
  # built so that this is not a deploy failure. Absent, `resolveProvider`
  # returns the recorded-fixture implementation and every sync run it serves
  # is stamped `provider: "fixture"`.
  optionalSecretEnv:
    COMPANIES_HOUSE_API_KEY: "secret://ws_G4TNSD0A/chaseid/{{ .environment }}/COMPANIES_HOUSE_API_KEY"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    orgName: sourceplane
    owner: sourceplane
    repo: chaseid

    turboFilter: "@saas/chase-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-d1,cloudflare-kv"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/chase-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/chase-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: chase
    runtime: cloudflare
